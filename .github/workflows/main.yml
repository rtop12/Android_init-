name: Build Custom Init

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl and cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build
        working-directory: code
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Verify binary
        working-directory: code
        run: |
          file target/aarch64-unknown-linux-musl/release/ksuinit
          ls -lh target/aarch64-unknown-linux-musl/release/ksuinit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: init-aarch64
          path: code/target/aarch64-unknown-linux-musl/release/ksuinit
